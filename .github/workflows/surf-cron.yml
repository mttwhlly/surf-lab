name: Surf Report Cron

on:
  schedule:
    - cron: '0 9 * * *'   # 5:00 AM ET
    - cron: '0 13 * * *'  # 9:00 AM ET
    - cron: '0 17 * * *'  # 1:00 PM ET
    - cron: '0 20 * * *'  # 4:00 PM ET
  workflow_dispatch:       # allow manual trigger from Actions tab

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Generate surf reports (all locations)
        run: |
          RESPONSE_FILE=$(mktemp)

          HTTP_CODE=$(curl -s -w "%{http_code}" \
            --max-time 120 \
            --retry 2 \
            --retry-delay 5 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -X GET "${{ secrets.VERCEL_URL }}/api/admin/request-forecast" \
            -o "$RESPONSE_FILE")

          echo "HTTP Response: $HTTP_CODE"
          cat "$RESPONSE_FILE" | python3 -m json.tool 2>/dev/null || cat "$RESPONSE_FILE"

          [ "$HTTP_CODE" = "200" ] || exit 1
